[idle]
behavior_order = ["screen-off", "suspend"]
pre_action_fade_seconds = 0

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 240

[idle.behavior.suspend]
action = "lock_and_suspend"
enabled = true
timeout = 300

[lockscreen]
enabled = true
lock_before_suspend = true

[shell]
polkit_agent = true
